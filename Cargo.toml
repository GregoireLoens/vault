# Espace de travail vault — T006
[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/vault-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/GregoireLoens/vault"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
