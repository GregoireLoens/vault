# Espace de travail vault — T006
[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/vault-cli"]
# Le harnais d'exploration est instrumenté : membre de l'espace de travail, il
# fausserait la mesure de couverture, dont le seuil à 100 % est bloquant.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/GregoireLoens/vault"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
