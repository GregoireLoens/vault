# Bibliothèque vault-core — T007
#
# Porte l'intégralité du format et de la cryptographie. Ne dépend ni de clap ni
# de rpassword : les tests de sécurité du principe VI l'attaquent directement.
[package]
name = "vault-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Cryptographie — aucune primitive maison (principe II)
chacha20poly1305 = "0.11.0"
aead = { version = "0.6.1", features = ["getrandom"] }
# La construction STREAM a quitté le crate aead en 0.6 pour vivre dans son
# propre crate, toujours maintenu par RustCrypto (voir D-003).
aead-stream = "0.6.0"
argon2 = "0.5.3"
blake3 = "1.8.6"
zeroize = { version = "1.9.0", features = ["derive"] }
secrecy = "0.10.3"

# Format
ciborium = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }

# Système de fichiers
fd-lock = "4.0.4"
walkdir = "2.5.0"
tempfile = "3.27.0"

# Divers
rand = "0.10.2"
thiserror = "2.0.19"

[dev-dependencies]
proptest = "1.11.0"
