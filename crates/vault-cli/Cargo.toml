# Binaire vault-cli — T008
#
# Simple habillage de vault-core : aucune logique cryptographique ici.
[package]
name = "vault-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core" }
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
