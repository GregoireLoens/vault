# Binaire vault-cli — T008
#
# Simple habillage de vault-core : aucune logique cryptographique ici.
[package]
name = "vault-cli"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core" }
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
tempfile = "3.27.0"
