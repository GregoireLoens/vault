# Portes bloquantes du principe VIII — T012, T013
#
# Les noms de jobs ci-dessous sont ceux à cocher dans la règle « Require status
# checks to pass before merging » du ruleset protégeant `main` (T015).
#
# Aucune action tierce n'est utilisée : uniquement des actions officielles
# GitHub. Sur un projet dont l'objet est la protection de données, chaque action
# tierce est une dépendance de chaîne d'approvisionnement de plus, exécutée avec
# accès au dépôt. La version de la chaîne Rust vient de rust-toolchain.toml, que
# le rustup préinstallé sur les exécuteurs applique automatiquement.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Versions figées, identiques à celles du Dockerfile : une porte ne doit pas
  # passer en local et échouer ici parce que l'outil n'a pas la même version.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_LLVM_COV_VERSION: 0.8.7

jobs:
  format:
    name: Formatage
    runs-on: ubuntu-latest
    # Sans délai maximal, un job bloqué tourne jusqu'à six heures. L'incident
    # GitHub Actions du 2026-08-06 a montré la différence : treize minutes
    # passées à réessayer de télécharger une action, sans qu'aucune commande
    # cargo ne démarre.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          # Sans restore-keys, la moindre modification de Cargo.lock repart
          # d'un cache vide et recompile tout le graphe de dépendances.
          restore-keys: ${{ runner.os }}-build-
      # Les niveaux de lint sont définis dans Cargo.toml ([workspace.lints]) :
      # clippy all + pedantic en deny, unsafe_code interdit.
      - run: cargo clippy --workspace --all-targets --all-features

  build:
    name: Compilation sans avertissement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-warnings-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-warnings-
      - run: cargo build --workspace --all-targets

  test:
    # La matrice n'est pas un luxe : la décision D-008 prévoit du code
    # spécifique à Windows, dont la sémantique de rename et de fsync diffère.
    # Elle est aussi ce qui rend la couverture à 100 % atteignable sans
    # dérogation (principe VIII).
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --all-targets

  coverage:
    name: Couverture 100%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Le cache des outils est séparé de celui de la compilation : sa clé ne
      # dépend que de la version de l'outil. Mélangés, la moindre modification
      # de Cargo.lock forcerait une réinstallation de plusieurs minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-tool-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-coverage-
      - name: Installer cargo-llvm-cov si absent du cache
        run: command -v cargo-llvm-cov || cargo install --locked cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      # Seuil bloquant : toute ligne non couverte fait échouer la fusion.
      #
      # `vault-cli/src/console/tty.rs` en est exclu, et lui seul. Ce fichier ne
      # contient que la lecture masquée sur le terminal, que cet exécuteur n'a
      # pas — et CLI-001 interdit de recevoir la passphrase autrement que par
      # une saisie masquée, donc de la lire depuis un tube pour la rendre
      # testable. Le principe VIII n'admet qu'une catégorie de dérogation, le
      # code qui ne peut pas s'exécuter sur la plateforme d'intégration
      # continue ; celle-ci en relève, et elle est justifiée dans le fichier.
      - run: |
          cargo llvm-cov --workspace --all-targets \
            --ignore-filename-regex 'vault-cli/src/console/tty\.rs' \
            --fail-under-lines 100

  fuzz-harness:
    # Le crate `fuzz/` est exclu de l'espace de travail : instrumenté, il
    # fausserait la mesure de couverture. Rien ne le compilerait donc, et il
    # pourrirait en silence — on ne s'en apercevrait que le jour où l'on veut
    # mener une campagne, c'est-à-dire le jour où l'on en a besoin.
    #
    # Les campagnes elles-mêmes ne sont **pas** jouées ici : leur durée n'est
    # pas bornée, ce qui les rend impropres à une porte. Voir
    # `docs/verifications.md` pour l'étendue de celles qui ont été menées.
    name: Harnais d'exploration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  format-spec:
    # Le principe IV exige qu'un vault soit déchiffrable à partir de sa seule
    # spécification, sans exécuter vault. Rien ne le vérifiait : `compat.rs`
    # déchiffre le vault de référence avec le code qui l'a écrit, ce qui prouve
    # la non-régression et non la suffisance du document.
    #
    # Cette porte fait tourner un déchiffreur écrit depuis le seul
    # `docs/format.md`, dans un autre langage et avec d'autres bibliothèques.
    # Un échec ici désigne une partie du document qui est fausse ou incomplète —
    # et c'est le document qu'il faut corriger, jamais la référence.
    name: Déchiffreur indépendant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installer les bibliothèques de vérification
        run: |
          python3 -m venv /opt/verification
          /opt/verification/bin/pip install --no-cache-dir --disable-pip-version-check \
            -r verification/dechiffreur/requirements.txt
      - name: Déchiffrer le vault de référence depuis la seule spécification
        run: |
          sortie=$(mktemp -d)
          echo "vault fixture v1 passphrase de reference" \
            | /opt/verification/bin/python verification/dechiffreur/dechiffrer.py \
                crates/vault-core/tests/fixtures/v1 "$sortie"
          /opt/verification/bin/python verification/dechiffreur/verifier.py \
            verification/dechiffreur/attendu.json "$sortie"

  supply-chain:
    name: Dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-tool-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Installer cargo-deny si absent du cache
        run: command -v cargo-deny || cargo install --locked cargo-deny@${{ env.CARGO_DENY_VERSION }}
      # Aucune dépendance réseau, même transitive (principe III, D-012).
      # Contrairement au conteneur local, l'exécuteur a le réseau : la
      # vérification des vulnérabilités peut cloner la base RustSec.
      - run: cargo deny check
